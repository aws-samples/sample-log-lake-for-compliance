                  - '*http://acs.amazonaws.com/groups/global/AuthenticatedUsers*'
Outputs:
  KeyArnForLogLake:
    Description: Key ARN used across log lake
    Value: !GetAtt EncryptKeyForLogLake.Arn
  KeyIdForLogLake:
    Description: Key ID used across log lake
    Value: !GetAtt EncryptKeyForLogLake.KeyId
  BucketArnForRawCloudTrail:
