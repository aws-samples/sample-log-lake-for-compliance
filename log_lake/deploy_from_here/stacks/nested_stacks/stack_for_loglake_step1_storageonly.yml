AWSTemplateFormatVersion : 2010-09-09
Description: "Create AWS resources for Log Lake (storage/buckets only)"
# ============================================================================
# IMPORTANT: DeletionPolicy is set to 'Delete' for all buckets to facilitate
# testing and cleanup. For production deployments, change DeletionPolicy to
# 'Retain' to prevent accidental data loss.
#
# Object Lock is enabled with GOVERNANCE mode (not COMPLIANCE) to allow
# testing flexibility. Users with s3:BypassGovernanceRetention permission
# can delete objects during testing. For production, consider COMPLIANCE mode.
# ============================================================================
Parameters:
  myBucketNameForRawCloudTrail:
    Type: String
  myBucketNameForRawCloudWatch:
    Type: String
  myBucketNameForReadReadyCloudTrail:
    Type: String
  myBucketNameForReadReadyCloudWatch:
    Type: String
  myKMSKeyAlias:
    Type: String
  myS3RawLifecycleExpirationDays:
    Type: Number
  myS3ReadReadyLifecycleExpirationDays:
    Type: Number
  myBucketNameForAccessLogs:
    Type: String
  myS3AccessLogsLifecycleExpirationDays:
    Type: Number
  myBucketNameForAthenaQueries:
    Type: String
  myS3AthenaQueriesLifecycleExpirationDays:
    Type: Number
  myS3ObjectLockDefaultRetentionDays:
    Type: Number
Resources:
  EncryptKeyForLogLake:
    Type: 'AWS::KMS::Key'
    DeletionPolicy: Retain
    Properties:
      Description: 'KMS key policy for LogLake queue bucket queries'
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: "Enable IAM User Permissions"
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 'kms:*'
            Resource: '*'
          - Sid: "Allow-S3-Access"
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Encrypt'
              - 'kms:DescribeKey'
              - 'kms:Decrypt'
            Resource: '*'
          - Sid: "Allow-S3-Logging-Service"
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action:
              - 'kms:GenerateDataKey'
              - 'kms:Decrypt'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
          - Sid: "Allow-Glue-Access"
            Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action:
            - 'kms:Decrypt'
            - 'kms:Encrypt'
            - 'kms:GenerateDataKey'
            - 'kms:GenerateDataKeyWithoutPlaintext'
            - 'kms:DescribeKey'
            - 'kms:CreateGrant'
            - 'kms:RetireGrant'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
          - Sid: "Allow-CloudWatch-Logs-With-Context"
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/jobs/*'
          - Sid: "Allow-CloudWatch-Logs-DescribeKey"
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
  KeyAliasForLogLakeS3:
    Type: 'AWS::KMS::Alias'
    Properties:
      AliasName: !Sub alias/${myKMSKeyAlias}
      TargetKeyId:
        Ref: EncryptKeyForLogLake
  StoreRawCloudTrailCopiesBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3AccessLogsBucket
    DeletionPolicy: Delete # Set as Delete for testing, change to Retain when completed
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID:
                Ref: EncryptKeyForLogLake
              SSEAlgorithm: 'aws:kms'
      BucketName: !Ref myBucketNameForRawCloudTrail
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldObjects
            Status: Enabled
            ExpirationInDays: !Ref myS3RawLifecycleExpirationDays
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: !Sub 'access-logs/${myBucketNameForRawCloudTrail}/'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref myS3ObjectLockDefaultRetentionDays
  StoreRawCloudTrailCopiesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: StoreRawCloudTrailCopiesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AsSource
            Effect: Allow
            Principal:
              AWS:
                !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 's3:Get*'
              - 's3:List*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${myBucketNameForRawCloudTrail}/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${myBucketNameForRawCloudTrail}'
          - Sid: DenyIncorrectEncryptionHeader
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${myBucketNameForRawCloudTrail}/*'
            Condition:
              StringEquals:
                's3:x-amz-server-side-encryption': 'AES256'
          - Sid: DenyNonHttpsConnections
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${myBucketNameForRawCloudTrail}'
              - !Sub 'arn:${AWS::Partition}:s3:::${myBucketNameForRawCloudTrail}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false
          - Sid: DenyPublicReadACL
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:PutObject'
              - 's3:PutObjectAcl'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${myBucketNameForRawCloudTrail}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl':
                  - 'public-read'
                  - 'public-read-write'
                  - 'authenticated-read'
          - Sid: DenyPublicReadGrant
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:PutObject'
              - 's3:PutObjectAcl'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${myBucketNameForRawCloudTrail}/*'
            Condition:
              StringLike:
                's3:x-amz-grant-read':
                  - '*http://acs.amazonaws.com/groups/global/AllUsers*'
                  - '*http://acs.amazonaws.com/groups/global/AuthenticatedUsers*'
  StoreRawCloudWatchCopiesBucket:
