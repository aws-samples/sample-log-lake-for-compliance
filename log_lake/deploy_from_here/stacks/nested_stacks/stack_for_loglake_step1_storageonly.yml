          - Sid: DenyPublicReadACL
            Effect: Deny
            Principal: '*'
            Action:
              - 's3:PutObject'
              - 's3:PutObjectAcl'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${myBucketNameForAccessLogs}/*'
            Condition:
